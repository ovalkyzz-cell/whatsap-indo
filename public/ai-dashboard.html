<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DASHBOARD AI - ADMIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

        :root {
            --bg: #FFFDF9;
            --box-bg: #FFFFFF;
            --border: #000000;
            --shadow: 5px 5px 0px #000000;
            --shadow-sm: 3px 3px 0px #000000;
            --primary: #FF5964;
            --secondary: #35A7FF;
            --accent: #FFD166;
            --success: #06D6A0;
            --text: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }
        
        /* Header */
        header { background: var(--primary); border-bottom: 4px solid var(--border); padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        header h1 { font-size: 1.5rem; color: #fff; text-transform: uppercase; letter-spacing: -1px; text-shadow: 2px 2px 0px #000; }
        .status { background: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 900; border: 3px solid var(--border); box-shadow: var(--shadow-sm); }
        .status.online { background: var(--success); }
        
        /* Main */
        main { padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--box-bg); border: 4px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
        .stat-card h3 { font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; font-weight: 900; }
        .stat-card .value { font-size: 2rem; font-weight: 900; }
        
        /* Bot List */
        .bot-section h2 { font-size: 1.2rem; margin-bottom: 15px; text-transform: uppercase; border-bottom: 4px solid var(--border); display: inline-block; }
        .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        
        .bot-card { background: var(--box-bg); border: 4px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); transition: 0.2s; }
        .bot-card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0px #000; }
        
        .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .bot-name { font-weight: 900; font-size: 1.1rem; }
        .bot-status { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; font-weight: 900; border: 2px solid var(--border); text-transform: uppercase; }
        .status-active { background: var(--success); }
        .status-depleted { background: var(--primary); color: #fff; }
        
        .bot-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .info-item label { font-size: 0.65rem; color: #555; text-transform: uppercase; font-weight: 900; }
        .info-item .val { font-size: 0.9rem; font-weight: 900; font-family: monospace; }
        
        /* Token Bar */
        .token-bar-bg { background: #eee; height: 16px; border-radius: 8px; border: 3px solid var(--border); overflow: hidden; margin: 10px 0; }
        .token-bar-fill { height: 100%; background: var(--secondary); border-right: 3px solid var(--border); }
        
        /* Buttons */
        .btn { padding: 10px 15px; border: 3px solid var(--border); border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: var(--shadow-sm); transition: 0.1s; }
        .btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-refill { background: var(--accent); }
        .btn-check { background: #fff; }
        
        /* Logs */
        .logs-section { margin-top: 30px; background: var(--box-bg); border: 4px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
        .logs-header { background: var(--accent); padding: 15px; border-bottom: 4px solid var(--border); font-weight: 900; }
        .logs-content { max-height: 300px; overflow-y: auto; padding: 15px; font-family: monospace; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--box-bg); padding: 30px; border-radius: 12px; border: 4px solid var(--border); box-shadow: var(--shadow); width: 90%; max-width: 400px; }
        .modal input { width: 100%; padding: 12px; border: 3px solid var(--border); border-radius: 8px; font-weight: 900; margin: 15px 0; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 AI DASHBOARD</h1>
        <div class="status online" id="statusIndicator">● ONLINE</div>
    </header>

    <main>
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Requests</h3>
                <div class="value" id="totalRequests">0</div>
                <div class="sub">Semua bot</div>
            </div>
            <div class="stat-card">
                <h3>Active Bots</h3>
                <div class="value" id="activeBots">0</div>
                <div class="sub">Bot tersedia</div>
            </div>
            <div class="stat-card">
                <h3>Depleted Tokens</h3>
                <div class="value" id="depletedBots">0</div>
                <div class="sub">Perlu refill</div>
            </div>
            <div class="stat-card">
                <h3>Pool Capacity</h3>
                <div class="value" id="poolCapacity">-</div>
                <div class="sub">Total token pool</div>
            </div>
        </div>

        <!-- Bot List -->
        <div class="bot-section">
            <h2>LIST BOT AI & TOKEN</h2>
            <div class="bot-grid" id="botList"></div>
        </div>

        <!-- Refill Modal -->
        <div class="modal" id="refillModal">
            <div class="modal-content">
                <h3>REFILL TOKEN BOT</h3>
                <p id="modalBotName" style="margin-bottom: 10px; color: #e94560;"></p>
                <label>Token baru (angka):</label>
                <input type="number" id="tokenAmount" placeholder="Contoh: 10000" min="100">
                <button class="btn-refill" onclick="confirmRefill()">REFILL TOKEN</button>
                <button class="close" onclick="closeModal()">BATAL</button>
            </div>
        </div>

        <!-- Logs -->
        <div class="logs-section">
            <div class="logs-header">
                <h3>📋 LOG REFILL & ACTIVITY</h3>
            </div>
            <div class="logs-content" id="logsContent"></div>
        </div>

        <!-- Refresh Button -->
        <div style="text-align: center; margin-top: 30px;">
            <button class="refresh-btn" onclick="refreshData()">↻ REFRESH DATA</button>
        </div>
    </main>

    <script>
        // Bot configuration (sesuai server/bots.js)
        const BOTS = [
            { id: 'bot-ai', name: 'AI Chat (GPT/Gemini/DeepSeek)', defaultTokens: 5000, type: 'chat' },
            { id: 'bot-down', name: 'Downloader (TikTok/IG/YouTube)', defaultTokens: 3000, type: 'download' },
            { id: 'bot-verif-am', name: 'Verif AM Premium', defaultTokens: 1000, type: 'action' },
            { id: 'bot-nftoken', name: 'Generate NFToken', defaultTokens: 1000, type: 'action' },
            { id: 'bot-email', name: 'Email Generator', defaultTokens: 1000, type: 'action' },
            { id: 'bot-tools', name: 'Tools (15+ tools)', defaultTokens: 2000, type: 'action' },
            { id: 'bot-kodesnap', name: 'Screenshot Kode', defaultTokens: 500, type: 'action' },
            { id: 'bot-npm-zip', name: 'Unduh Kode npm', defaultTokens: 500, type: 'action' },
            { id: 'bot-model-ai', name: 'Katalog Model AI', defaultTokens: 500, type: 'info' },
        ];

        let botsState = {};
        let totalPool = 0;

        // Load from localStorage or API
        async function loadState() {
            try {
                const stored = localStorage.getItem('ai_bots_state');
                if (stored) {
                    botsState = JSON.parse(stored);
                } else {
                    // Initialize with default values
                    botsState = {};
                    BOTS.forEach(bot => {
                        botsState[bot.id] = {
                            tokens: bot.defaultTokens,
                            requests: 0,
                            status: 'active'
                        };
                    });
                }
                totalPool = Object.values(botsState).reduce((sum, b) => sum + b.tokens, 0);
            } catch (e) {
                console.error('Load error:', e);
            }
        }

        // Save to localStorage
        function saveState() {
            localStorage.setItem('ai_bots_state', JSON.stringify(botsState));
        }

        // Add log
        function addLog(message) {
            const logs = document.getElementById('logsContent');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleString('id-ID');
            entry.innerHTML = `<div class="log-time">[${time}]</div>${message}`;
            logs.prepend(entry);
            
            // Keep only last 50 logs
            while (logs.children.length > 50) {
                logs.removeChild(logs.lastChild);
            }
        }

        // Render bots
        function renderBots() {
            const container = document.getElementById('botList');
            container.innerHTML = '';
            
            let activeCount = 0;
            let depletedCount = 0;
            let totalRequests = 0;

            BOTS.forEach(bot => {
                const state = botsState[bot.id] || { tokens: bot.defaultTokens, requests: 0, status: 'active' };
                const percentage = (state.tokens / (bot.defaultTokens * 2)) * 100;
                
                let statusClass = 'status-active';
                let statusText = 'Aktif';
                
                if (state.tokens <= 0) {
                    statusClass = 'status-depleted';
                    statusText = 'Token Habis';
                    depletedCount++;
                } else if (state.tokens < bot.defaultTokens * 0.2) {
                    statusClass = 'status-empty';
                    statusText = 'Hampir Habis';
                } else {
                    activeCount++;
                }

                totalRequests += state.requests;

                const card = document.createElement('div');
                card.className = 'bot-card';
                card.innerHTML = `
                    <div class="bot-header">
                        <span class="bot-name">${bot.name}</span>
                        <span class="bot-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="bot-body">
                        <div class="bot-info">
                            <div class="info-item">
                                <label>Tokens</label>
                                <div class="val">${state.tokens.toLocaleString()}</div>
                            </div>
                            <div class="info-item">
                                <label>Requests</label>
                                <div class="val">${state.requests.toLocaleString()}</div>
                            </div>
                            <div class="info-item">
                                <label>Default</label>
                                <div class="val">${bot.defaultTokens.toLocaleString()}</div>
                            </div>
                            <div class="info-item">
                                <label>Type</label>
                                <div class="val">${bot.type}</div>
                            </div>
                        </div>
                        <div class="token-bar">
                            <div class="token-label">
                                <span>Progress Token</span>
                                <span>${Math.min(100, Math.round(percentage))}%</span>
                            </div>
                            <div class="token-bar-bg">
                                <div class="token-bar-fill" style="width: ${Math.min(100, percentage)}%"></div>
                            </div>
                        </div>
                        <div class="bot-actions">
                            <button class="btn btn-refill" onclick="openRefill('${bot.id}')">REFILL</button>
                            <button class="btn btn-check" onclick="checkToken('${bot.id}')">CHECK</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Update stats
            document.getElementById('totalRequests').textContent = totalRequests.toLocaleString();
            document.getElementById('activeBots').textContent = activeCount;
            document.getElementById('depletedBots').textContent = depletedCount;
            document.getElementById('poolCapacity').textContent = totalPool.toLocaleString();
        }

        // Open refill modal
        function openRefill(botId) {
            const bot = BOTS.find(b => b.id === botId);
            document.getElementById('modalBotName').textContent = bot ? bot.name : botId;
            document.getElementById('tokenAmount').value = '';
            document.getElementById('refillModal').classList.add('show');
        }

        // Close modal
        function closeModal() {
            document.getElementById('refillModal').classList.remove('show');
        }

        // Confirm refill
        function confirmRefill() {
            const amount = parseInt(document.getElementById('tokenAmount').value);
            if (!amount || amount < 100) {
                alert('Token minimal 100');
                return;
            }

            const botId = Object.keys(botsState).find(k => botsState[k].tokens === null || botsState[k].tokens === undefined) || 'bot-ai';
            
            // Update token (add to existing)
            let totalAdded = 0;
            Object.keys(botsState).forEach(id => {
                if (botsState[id]) {
                    const added = Math.floor(amount / 5); // Distribute to all bots
                    if (added > 0) {
                        botsState[id].tokens += added;
                        totalAdded += added;
                    }
                }
            });

            // Update pool total
            totalPool = Object.values(botsState).reduce((sum, b) => sum + b.tokens, 0);
            
            saveState();
            renderBots();
            addLog(`Refill: +${totalAdded.toLocaleString()} tokens distributed`);
            
            closeModal();
            alert(`Refill successful! Total: ${totalAdded.toLocaleString()} tokens`);
        }

        // Check token
        async function checkToken(botId) {
            const bot = BOTS.find(b => b.id === botId);
            if (!bot) return;
            
            const state = botsState[botId];
            alert(`Bot: ${bot.name}\nTokens: ${state.tokens.toLocaleString()}\nRequests: ${state.requests.toLocaleString()}\nStatus: ${state.tokens <= 0 ? 'HABIS' : state.tokens < bot.defaultTokens * 0.2 ? 'HAMPIS' : 'AKTIF'}`);
        }

        // Refresh data
        async function refreshData() {
            document.getElementById('statusIndicator').textContent = '● MEMUAT...';
            document.getElementById('statusIndicator').className = 'status offline';
            
            // Simulate API refresh
            await new Promise(r => setTimeout(r, 500));
            
            loadState();
            renderBots();
            
            document.getElementById('statusIndicator').textContent = '● ONLINE';
            document.getElementById('statusIndicator').className = 'status online';
            addLog('Data refresh: Berhasil');
        }

        // Load and render
        loadState();
        renderBots();

        // Auto refresh every 30 seconds
        setInterval(() => {
            refreshData();
        }, 30000);

        // Close modal on outside click
        document.getElementById('refillModal').addEventListener('click', (e) => {
            if (e.target.id === 'refillModal') closeModal();
        });
    </script>
</body>
</html>
